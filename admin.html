<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área da Daiane | Dayane Nails</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap');
:root{--m:#741f2b;--md:#4d121b;--bg:#fbf8f5;--ink:#24191b;--muted:#796d6f;--line:#eadedf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:32px 18px 60px}
.back{display:inline-block;color:var(--m);text-decoration:none;font-size:12px;margin-bottom:24px}
.brand{font:600 44px/1 'Cormorant Garamond',serif;color:var(--m)}
.box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;margin-top:22px;box-shadow:0 8px 30px rgba(50,20,25,.04)}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--m)}
h1{font:500 44px/1.05 'Cormorant Garamond',serif;color:var(--m);margin:8px 0 12px}
p{color:var(--muted);line-height:1.7}
input{width:100%;max-width:430px;padding:15px;border:1px solid var(--line);border-radius:12px;font:14px Montserrat;background:#fff}
button{border:0;border-radius:100px;background:var(--m);color:#fff;padding:13px 20px;font:600 11px Montserrat;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--md)}
.loginbtn{margin-top:12px}
.outline{background:#fff;color:var(--m);border:1px solid var(--m)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted);margin:12px 0 20px}
.card{border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;background:#fff}
.date{font-size:13px;font-weight:600;color:var(--m);letter-spacing:.04em}
.name{font:600 25px 'Cormorant Garamond',serif;margin:5px 0}
.details{font-size:13px;color:var(--muted);line-height:1.9}
.cancel{margin-top:14px;background:#fff;color:#8b1e2d;border:1px solid #d9aeb4;font-size:10px;padding:10px 14px}
.error{color:#8b1e2d;font-size:13px;margin-top:12px}
.empty{padding:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Voltar ao site</a>
  <div class="brand">Dayane Nails</div>

  <section class="box" id="login">
    <div class="eyebrow">Área exclusiva</div>
    <h1>Agendamentos</h1>
    <p>Entre para consultar e gerir os horários das clientes.</p>
    <input id="password" type="password" placeholder="Senha da Daiane">
    <br><button class="loginbtn" id="enter">Entrar</button>
    <div id="error" class="error" style="display:none">Senha incorreta.</div>
  </section>

  <section class="box" id="panel" style="display:none">
    <div class="top">
      <div>
        <div class="eyebrow">Área da Daiane</div>
        <h1>Meus agendamentos</h1>
      </div>
      <div class="actions">
        <button id="refresh">Atualizar</button>
        <button id="logout" class="outline">Sair</button>
      </div>
    </div>
    <div id="count" class="count"></div>
    <div id="list"></div>
  </section>
</div>

<script>
const SUPABASE_URL='https://iywrgssheqizpumsktnb.supabase.co';
const SUPABASE_KEY='sb_publishable_qBBxtcypQlIVzI68RXWEkw_rEhcYitQ';
const ADMIN_PASSWORD='dayane123';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const login=document.getElementById('login');
const panel=document.getElementById('panel');
const password=document.getElementById('password');
const error=document.getElementById('error');
const list=document.getElementById('list');
const count=document.getElementById('count');

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function dateBR(v){if(!v)return '-';const [y,m,d]=String(v).slice(0,10).split('-');return d&&m&&y?`${d}/${m}/${y}`:v;}

async function carregar(){
  list.innerHTML='<p class="empty">Carregando agendamentos...</p>';
  const {data,error:err}=await db.from('Agendamentos')
    .select('id,Nome,Telemovel,Servico,Data,Horario,Status')
    .eq('Status','confirmado')
    .order('Data',{ascending:true})
    .order('Horario',{ascending:true});

  if(err){
    console.error(err);
    list.innerHTML='<p class="error">Não foi possível carregar os agendamentos.</p>';
    return;
  }

  count.textContent=`${(data||[]).length} agendamento(s) confirmado(s)`;

  if(!data||!data.length){
    list.innerHTML='<p class="empty">Nenhum agendamento confirmado ainda.</p>';
    return;
  }

  list.innerHTML=data.map(a=>`
    <article class="card" id="a-${a.id}">
      <div class="date">📅 ${dateBR(a.Data)} &nbsp; • &nbsp; 🕐 ${esc(String(a.Horario||'').slice(0,5))}</div>
      <div class="name">${esc(a.Nome||'Sem nome')}</div>
      <div class="details">
        💅 ${esc(a.Servico||'-')}<br>
        📱 ${esc(a.Telemovel||'-')}
      </div>
      <button class="cancel" data-id="${a.id}">Cancelar agendamento</button>
    </article>`).join('');

  document.querySelectorAll('.cancel').forEach(b=>b.addEventListener('click',()=>cancelar(b.dataset.id)));
}

async function cancelar(id){
  if(!confirm('Tem certeza que deseja cancelar este agendamento?')) return;
  const {error:err}=await db.from('Agendamentos').update({Status:'cancelado'}).eq('id',id);
  if(err){
    console.error(err);
    alert('Não foi possível cancelar. Precisamos liberar a permissão de atualização no Supabase.');
    return;
  }
  alert('Agendamento cancelado. O horário voltou a ficar disponível.');
  carregar();
}

document.getElementById('enter').onclick=()=>{
  if(password.value===ADMIN_PASSWORD){
    login.style.display='none';panel.style.display='block';error.style.display='none';carregar();
  }else error.style.display='block';
};
password.onkeydown=e=>{if(e.key==='Enter')document.getElementById('enter').click()};
document.getElementById('refresh').onclick=carregar;
document.getElementById('logout').onclick=()=>{
  panel.style.display='none';login.style.display='block';password.value='';
};
</script>
</body>
</html>
